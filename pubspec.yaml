name: paydo_tj
description: "PAYDO.TJ — Ҳама чиз дар як барнома. Super App / marketplace барои Тоҷикистон."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---- State management (стандарти интихобшуда: Riverpod) ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- Firebase ----
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0

  # ---- Google Sign-In ----
  google_sign_in: ^6.2.1

  # ---- Maps (free/open-source: MapLibre + OSM) ----
  maplibre_gl: ^0.20.0

  # ---- Utilities ----
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  equatable: ^2.0.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  logger: ^2.4.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

# Иконкаи барнома (PHASE: post-12, дархости корбар) — аз ҳамин як
# файли лого барои Android/iOS/Web худкор сохта мешавад.
# Фармон: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#0A0E27"
    theme_color: "#12B76A"
  windows:
    generate: false
  macos:
    generate: false
