name: Flutter Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Web
          path: build/web

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Windows
          path: build/windows/x64/runner/Release

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Linux
          path: build/linux/x64/release/bundle

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-macOS
          path: build/macos/Build/Products/Release/*.app

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-iOS-App
          path: build/ios/iphoneos/Runner.app
