name: PAYDO.TJ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name=paydo_tj .

      - name: Get dependencies
        run: flutter pub get

      - name: Clean
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Generate Android app icons
        shell: bash
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "flutter_launcher_icons is not configured; using existing Android icon."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
