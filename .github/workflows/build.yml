name: PAYDO.TJ Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # ANDROID APK
  # =========================
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform files
        run: |
          flutter create . --platforms=android,ios,windows

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk


  # =========================
  # WINDOWS
  # =========================
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform files
        run: |
          flutter create . --platforms=android,ios,windows

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath PAYDO-TJ-Windows.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Windows
          path: PAYDO-TJ-Windows.zip


  # =========================
  # iOS
  # =========================
  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform files
        run: |
          flutter create . --platforms=android,ios,windows

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-iOS
          path: build/ios/iphoneos/Runner.app
