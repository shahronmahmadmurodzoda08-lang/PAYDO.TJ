name: PAYDO TJ - Build All Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # ==========================
  # ANDROID
  # ==========================
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name=paydo_tj .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk


  # ==========================
  # WINDOWS
  # ==========================
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows platform
        run: flutter create --platforms=windows --project-name=paydo_tj .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "PAYDO-TJ-Windows.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Windows
          path: PAYDO-TJ-Windows.zip


  # ==========================
  # WEB
  # ==========================
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Web platform
        run: flutter create --platforms=web --project-name=paydo_tj .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Web
          path: build/web


  # ==========================
  # LINUX
  # ==========================
  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Linux platform
        run: flutter create --platforms=linux --project-name=paydo_tj .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Linux
        run: flutter build linux --release

      - name: Create ZIP
        run: |
          cd build/linux/x64/release
          zip -r ../../../../PAYDO-TJ-Linux.zip bundle

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-Linux
          path: PAYDO-TJ-Linux.zip


  # ==========================
  # IOS
  # ==========================
  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS platform
        run: flutter create --platforms=ios --project-name=paydo_tj .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: PAYDO-TJ-iOS-App
          path: build/ios/iphoneos/Runner.app
