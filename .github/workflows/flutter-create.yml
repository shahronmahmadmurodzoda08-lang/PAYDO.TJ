name: Flutter Create Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-platforms:
    name: Create Android iOS macOS Windows Linux Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform files
        run: |
          flutter create --platforms=android,ios,macos,windows,linux,web --overwrite .

      - name: Get packages
        run: flutter pub get

      - name: Commit platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android ios macos windows linux web

          if git diff --cached --quiet; then
            echo "Platform files are already up to date."
          else
            git commit -m "Create Flutter platform files"
            git push
          fi
