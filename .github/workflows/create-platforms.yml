name: PAYDO TJ - Create All Platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-platforms:
    name: Create Android iOS Windows Web Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create all platform files
        run: |
          flutter create \
            --platforms=android,ios,windows,web,linux \
            --project-name=paydo_tj \
            --overwrite .

      - name: Get dependencies
        run: flutter pub get

      - name: Check project
        run: flutter analyze

      - name: Save platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android ios windows web linux

          if git diff --cached --quiet; then
            echo "No platform changes."
          else
            git commit -m "Create PAYDO TJ platform files"
            git push
          fi
